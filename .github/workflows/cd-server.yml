name: CD Server
run-name: "CD Server: ${{ github.ref_name }}"

on:
  push:
    branches: [main]
    tags:
      - 'server-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR/Docker require lowercase image paths, but the
  # GitHub org name (Printmaster-Org) contains uppercase letters.
  IMAGE_NAME: printmaster-org/printmaster

permissions:
  contents: read

jobs:
  # Wait for CI to pass on this commit
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: read
    steps:
    - name: Wait for CI checks to pass
      uses: matiasalbarello/wait-on-check-action-ts@8087812521cdb59ebc7751984b31b17209b30eeb # v1.2.0
      timeout-minutes: 15
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        check-name: CI Passed
        ref: ${{ github.sha }}
        allowed-conclusions: success
        wait-interval: 15
        fail-on-no-checks: 'true'
        # CI's aggregate job may not register immediately; allow the full wait budget.
        checks-discovery-timeout: 900

  build-server:
    name: Build Server Binaries
    needs: [wait-for-ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
          - os: ubuntu-26.04
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.0'
        cache-dependency-path: |
          common/go.sum
          server/go.sum
    
    - name: Get version
      id: version
      shell: bash
      run: |
        BASE_VERSION=$(cat server/VERSION)
        GIT_COMMIT=$(git rev-parse --short HEAD)
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        # Determine if this is a release (tag push) or dev build (main branch push)
        if [[ "${{ github.ref }}" == refs/tags/server-v* ]]; then
          echo "server_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "build_type=release" >> $GITHUB_OUTPUT
        else
          echo "server_version=${BASE_VERSION}-dev.${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "build_type=dev" >> $GITHUB_OUTPUT
        fi
        
        echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
    
    - name: Build Server
      working-directory: ./server
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X 'main.Version=${{ steps.version.outputs.server_version }}' -X 'main.BuildTime=${{ steps.version.outputs.build_time }}' -X 'main.GitCommit=${{ steps.version.outputs.git_commit }}' -X 'main.BuildType=${{ steps.version.outputs.build_type }}'" -o printmaster-server-v${{ steps.version.outputs.server_version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .
    
    - name: Upload Server Binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: server-${{ matrix.goos }}-${{ matrix.goarch }}
        path: server/printmaster-server-v${{ steps.version.outputs.server_version }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: [wait-for-ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            suffix: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get version
      id: version
      run: |
        BASE_VERSION=$(cat server/VERSION)
        GIT_COMMIT=$(git rev-parse --short HEAD)
        echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
        echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
        # Dev builds from main branch, release builds from tags
        if [[ "${{ github.ref }}" == refs/tags/server-v* ]]; then
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "build_type=release" >> $GITHUB_OUTPUT
        else
          echo "version=${BASE_VERSION}-dev.${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "build_type=dev" >> $GITHUB_OUTPUT
        fi
    
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./server/Dockerfile
        platforms: ${{ matrix.platform }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ steps.version.outputs.build_time }}
          GIT_COMMIT=${{ steps.version.outputs.git_commit }}
          BUILD_TYPE=${{ steps.version.outputs.build_type }}
        cache-from: type=gha,scope=server-${{ matrix.suffix }}
        cache-to: type=gha,mode=max,scope=server-${{ matrix.suffix }}
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server,push-by-digest=true,name-canonical=true,push=true
        provenance: false
        sbom: false
    
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
    
    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: server-digests-${{ matrix.suffix }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-docker:
    name: Create Docker Manifest
    needs: [build-docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: /tmp/digests
        pattern: server-digests-*
        merge-multiple: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get version
      id: version
      run: |
        echo "version=$(cat server/VERSION)" >> $GITHUB_OUTPUT
        echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        # Determine if this is a release (tag push) or dev build (main branch push)
        if [[ "${{ github.ref }}" == refs/tags/server-v* ]]; then
          echo "is_release=true" >> $GITHUB_OUTPUT
        else
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release }}
          type=raw,value=latest,enable=${{ steps.version.outputs.is_release }}
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev-${{ steps.version.outputs.git_commit }},enable=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.description=PrintMaster Server container image (build ${{ steps.version.outputs.version }} / commit ${{ steps.version.outputs.git_commit }})
    
    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server@sha256:%s ' *)
    
    - name: Inspect image
      run: |
        if [[ "${{ github.ref }}" == refs/tags/server-v* ]]; then
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ steps.version.outputs.version }}
        else
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:main
        fi

  release-server:
    name: Create Server Release
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: [build-server, merge-docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: server-*
        merge-multiple: false
    
    - name: Get version info
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SERVER_VERSION=$(cat server/VERSION)
        echo "version=$SERVER_VERSION" >> $GITHUB_OUTPUT
        echo "tag=server-v$SERVER_VERSION" >> $GITHUB_OUTPUT
        
        # Extract major.minor for compatible agent matching
        MAJOR_MINOR=$(echo "$SERVER_VERSION" | sed 's/\.[^.]*$//')
        
        # Find latest stable agent with matching minor version (e.g., server 0.9.5 -> agent 0.9.*).
        # Dev tags (agent-vX.Y.Z-dev.sha) sort above their stable release, so exclude them.
        MATCHING_AGENT_TAG=$(git tag -l "agent-v${MAJOR_MINOR}.*" --sort=-version:refname | grep -E '^agent-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
        
        if [ -n "$MATCHING_AGENT_TAG" ]; then
          echo "agent_version=${MATCHING_AGENT_TAG#agent-v}" >> $GITHUB_OUTPUT
          echo "agent_tag=$MATCHING_AGENT_TAG" >> $GITHUB_OUTPUT
          # RPM names carry a release/dist suffix (e.g. 0.31.1-1.fc44), so read the real asset name.
          RPM_ASSET=$(gh release view "$MATCHING_AGENT_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name | select(endswith(".x86_64.rpm"))' 2>/dev/null | head -n 1 || true)
          echo "agent_rpm=$RPM_ASSET" >> $GITHUB_OUTPUT
          echo "Found compatible agent: $MATCHING_AGENT_TAG"
        else
          echo "agent_version=" >> $GITHUB_OUTPUT
          echo "agent_tag=" >> $GITHUB_OUTPUT
          echo "No compatible agent found for v${MAJOR_MINOR}.*"
        fi
    
    - name: Prepare release binaries
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          binary=$(find "$dir" -maxdepth 1 -type f -name "printmaster-*" | head -n 1)
          if [ -n "$binary" ]; then
            cp "$binary" "./$(basename "$binary")"
            echo "Prepared: $(basename "$binary")"
          fi
        done
        echo "=== Release Binaries ==="
        ls -lh printmaster-* 2>/dev/null || true
    
    - name: Generate changelog
      id: changelog
      run: |
        TAG_NAME="server-v${{ steps.version.outputs.version }}"
        VERSION="${{ steps.version.outputs.version }}"
        
        # Parse version components
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        
        # Determine release type and find appropriate comparison tag
        if [ "$PATCH" = "0" ] && [ "$MINOR" = "0" ]; then
          # Major release (x.0.0) - compare against last major
          RELEASE_TYPE="major"
          PREV_MAJOR=$((MAJOR - 1))
          LAST_TAG=$(git tag -l "server-v${PREV_MAJOR}.*" --sort=-version:refname | head -n 1)
        elif [ "$PATCH" = "0" ]; then
          # Minor release (x.y.0) - compare against last minor's first tag
          RELEASE_TYPE="minor"
          PREV_MINOR=$((MINOR - 1))
          LAST_TAG=$(git tag -l "server-v${MAJOR}.${PREV_MINOR}.*" --sort=-version:refname | head -n 1)
        else
          # Patch release - compare against previous patch
          RELEASE_TYPE="patch"
          LAST_TAG=$(git tag -l "server-v*" --sort=-version:refname | grep -v "^${TAG_NAME}$" | head -n 1)
        fi
        
        echo "Release type: $RELEASE_TYPE, comparing against: ${LAST_TAG:-none}"
        
        if [ -z "$LAST_TAG" ]; then
          CHANGELOG="Initial release"
        else
          # Get commits, filter release commits, and categorize
          RAW_LOG=$(git log ${LAST_TAG}..${TAG_NAME} --pretty=format:"%s|||%h" --no-merges 2>/dev/null || echo "")
          
          if [ -z "$RAW_LOG" ]; then
            CHANGELOG="- Bug fixes and improvements"
          else
            # Categorize commits by conventional commit type
            FEATURES=""
            FIXES=""
            DOCS=""
            REFACTORS=""
            OTHER=""
            
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              MSG=$(echo "$line" | cut -d'|' -f1)
              HASH=$(echo "$line" | rev | cut -d'|' -f1 | rev)
              
              # Skip release commits
              echo "$MSG" | grep -q "^chore: Release" && continue
              echo "$MSG" | grep -q "^chore(release)" && continue
              
              # Categorize by type
              if echo "$MSG" | grep -qE "^feat(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^feat[^:]*: //')
                FEATURES="${FEATURES}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^fix(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^fix[^:]*: //')
                FIXES="${FIXES}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^docs(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^docs[^:]*: //')
                DOCS="${DOCS}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^refactor(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^refactor[^:]*: //')
                REFACTORS="${REFACTORS}- ${DESC} (${HASH})\n"
              elif ! echo "$MSG" | grep -qE "^(chore|test|ci|build)(\([^)]+\))?:"; then
                # Include non-chore/test/ci/build commits in OTHER
                OTHER="${OTHER}- ${MSG} (${HASH})\n"
              fi
            done <<< "$RAW_LOG"
            
            # Build changelog with sections
            CHANGELOG=""
            [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### ✨ Features\n${FEATURES}\n"
            [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n"
            [ -n "$REFACTORS" ] && CHANGELOG="${CHANGELOG}### ♻️ Refactoring\n${REFACTORS}\n"
            [ -n "$DOCS" ] && CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n"
            [ -n "$OTHER" ] && CHANGELOG="${CHANGELOG}### 📝 Other Changes\n${OTHER}\n"
            
            # Fallback if nothing was categorized
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
          fi
        fi
        
        # For major releases, add a note about checking full changelog
        if [ "$RELEASE_TYPE" = "major" ]; then
          CHANGELOG="**🎉 Major Release**\n\nThis is a major version update. Please review the [full changelog](https://github.com/printmaster-org/printmaster/compare/${LAST_TAG}...${TAG_NAME}) for breaking changes.\n\n${CHANGELOG}"
        fi
        
        {
          echo 'CHANGELOG<<EOF'
          echo -e "$CHANGELOG"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: PrintMaster Server v${{ steps.version.outputs.version }}
        body: |
          ## PrintMaster Server v${{ steps.version.outputs.version }}
          
          ### 📝 Changes
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ---
          
          ### 📦 Installation
          
          #### Docker (Recommended)
          ```bash
          # Pull the latest image (supports amd64, arm64, arm/v7)
          docker pull ghcr.io/printmaster-org/printmaster-server:${{ steps.version.outputs.version }}
          docker pull ghcr.io/printmaster-org/printmaster-server:latest
          
          # Run the container
          docker run -d \
            --name printmaster-server \
            -p 9090:9090 \
            -v printmaster-data:/var/lib/printmaster/server \
            ghcr.io/printmaster-org/printmaster-server:latest
          ```
          
          #### Binary Installation
          1. Download the appropriate binary for your platform from the Assets section below
          2. Extract the archive
          3. Run the binary with `--help` to see available options
          
          **Supported Platforms:**
          - Windows (amd64)
          - Linux (amd64, arm64)
          - macOS (amd64, arm64)
          
          ---
          
          ### 🤖 Agent Downloads
          
          You'll need the PrintMaster Agent to discover and monitor printers. Download the latest agent:
          
          **Latest Agent: v${{ steps.version.outputs.agent_version }}** — [View Release](https://github.com/printmaster-org/printmaster/releases/tag/${{ steps.version.outputs.agent_tag }})
          
          **Debian/Ubuntu (APT repo, signed):**
          ```bash
          curl -fsSL https://packages.printmaster.work/install.sh | sudo bash
          ```
          
          **Fedora/RHEL (DNF repo):**
          ```bash
          sudo dnf config-manager addrepo --from-repofile=https://packages.printmaster.work/printmaster.repo && sudo dnf install -y printmaster-agent
          ```
          
          | Platform | Download |
          |----------|----------|
          | Windows (MSI) | [printmaster-agent-v${{ steps.version.outputs.agent_version }}-windows-amd64.msi](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent-v${{ steps.version.outputs.agent_version }}-windows-amd64.msi) |
          | Linux (amd64) | [printmaster-agent-v${{ steps.version.outputs.agent_version }}-linux-amd64](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent-v${{ steps.version.outputs.agent_version }}-linux-amd64) |
          | Linux (arm64) | [printmaster-agent-v${{ steps.version.outputs.agent_version }}-linux-arm64](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent-v${{ steps.version.outputs.agent_version }}-linux-arm64) |
          | Debian/Ubuntu (amd64) | [printmaster-agent_${{ steps.version.outputs.agent_version }}_amd64.deb](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent_${{ steps.version.outputs.agent_version }}_amd64.deb) |
          | Debian/Ubuntu (arm64) | [printmaster-agent_${{ steps.version.outputs.agent_version }}_arm64.deb](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent_${{ steps.version.outputs.agent_version }}_arm64.deb) |
          | Fedora/RHEL | ${{ steps.version.outputs.agent_rpm && format('[{0}](https://github.com/printmaster-org/printmaster/releases/download/{1}/{0})', steps.version.outputs.agent_rpm, steps.version.outputs.agent_tag) || format('[RPM packages](https://github.com/printmaster-org/printmaster/releases/tag/{0})', steps.version.outputs.agent_tag) }} |
          | macOS (Intel) | [printmaster-agent-v${{ steps.version.outputs.agent_version }}-darwin-amd64](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent-v${{ steps.version.outputs.agent_version }}-darwin-amd64) |
          | macOS (Apple Silicon) | [printmaster-agent-v${{ steps.version.outputs.agent_version }}-darwin-arm64](https://github.com/printmaster-org/printmaster/releases/download/${{ steps.version.outputs.agent_tag }}/printmaster-agent-v${{ steps.version.outputs.agent_version }}-darwin-arm64) |
          
          ---
          
          ### ⏱️ Build Information
          - **Workflow run:** ${{ github.run_id }}
          - **Commit:** ${{ github.sha }}
          
          ### 🔗 Links
          - [Documentation](https://docs.printmaster.work/)
          - [Docker Images](https://github.com/printmaster-org/printmaster/pkgs/container/printmaster-server)
          - [Issue Tracker](https://github.com/printmaster-org/printmaster/issues)
        files: artifacts/printmaster-*
        fail_on_unmatched_files: false
        draft: false
        prerelease: false

    - name: Notify website about published Server release
      env:
        WEBHOOK_SECRET: ${{ secrets.PRINTMASTER_WEBSITE_RELEASE_SECRET }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        if [[ -z "$WEBHOOK_SECRET" ]]; then
          echo "Website release webhook secret is not configured; skipping notification."
          exit 0
        fi
        payload=$(jq -cn --arg tag "$RELEASE_TAG" '{tag_name: $tag}')
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
        curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          -X POST "https://printmaster.work/api/releases/refresh" \
          -H 'Content-Type: application/json' \
          -H "X-PrintMaster-Signature: sha256=$signature" \
          --data "$payload"
      continue-on-error: true

  release-server-dev:
    name: Create Server Dev Release
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    needs: [build-server, merge-docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: server-*
        merge-multiple: false
    
    - name: Get version info
      id: version
      run: |
        BASE_VERSION=$(cat server/VERSION)
        GIT_COMMIT=$(git rev-parse --short HEAD)
        DEV_VERSION="${BASE_VERSION}-dev.${GIT_COMMIT}"
        echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "tag=server-v$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
        echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
    
    - name: Prepare release binaries
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          binary=$(find "$dir" -maxdepth 1 -type f -name "printmaster-*" | head -n 1)
          if [ -n "$binary" ]; then
            cp "$binary" "./$(basename "$binary")"
            echo "Prepared: $(basename "$binary")"
          fi
        done
        echo "=== Release Binaries ==="
        ls -lh printmaster-* 2>/dev/null || true
    
    - name: Delete existing dev release (if any)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete the existing dev tag/release if it exists (we always update the dev release)
        TAG="server-v${{ steps.version.outputs.version }}"
        if gh release view "$TAG" &>/dev/null; then
          echo "Deleting existing release $TAG..."
          gh release delete "$TAG" --yes || true
        fi
        if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
          echo "Deleting existing tag $TAG..."
          git push origin --delete "$TAG" || true
        fi
    
    - name: Create GitHub Dev Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: PrintMaster Server v${{ steps.version.outputs.version }} (Dev)
        body: |
          ## PrintMaster Server v${{ steps.version.outputs.version }} (Development Build)
          
          ⚠️ **This is a development build from the main branch.** It may contain unstable or experimental features.
          
          To receive dev builds automatically, set your server's `releases.include_prerelease = "true"` or run a dev build of the server.
          
          ---
          
          ### 📦 Installation
          
          #### Docker
          ```bash
          # Pull the dev image
          docker pull ghcr.io/printmaster-org/printmaster-server:main
          
          # Run the container
          docker run -d \
            --name printmaster-server \
            -p 9090:9090 \
            -v printmaster-data:/var/lib/printmaster/server \
            ghcr.io/printmaster-org/printmaster-server:main
          ```
          
          ---
          
          ### ⏱️ Build Information
          - **Base Version:** ${{ steps.version.outputs.base_version }}
          - **Commit:** ${{ steps.version.outputs.git_commit }}
          - **Full SHA:** ${{ github.sha }}
          - **Workflow run:** ${{ github.run_id }}
          
          ### 🔗 Links
          - [Documentation](https://docs.printmaster.work/)
          - [Docker Images](https://github.com/printmaster-org/printmaster/pkgs/container/printmaster-server)
          - [Issue Tracker](https://github.com/printmaster-org/printmaster/issues)
        files: artifacts/printmaster-*
        fail_on_unmatched_files: false
        draft: false
        prerelease: true

    - name: Notify website about published Server beta release
      env:
        WEBHOOK_SECRET: ${{ secrets.PRINTMASTER_WEBSITE_RELEASE_SECRET }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        if [[ -z "$WEBHOOK_SECRET" ]]; then
          echo "Website release webhook secret is not configured; skipping notification."
          exit 0
        fi
        payload=$(jq -cn --arg tag "$RELEASE_TAG" '{tag_name: $tag}')
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
        curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          -X POST "https://printmaster.work/api/releases/refresh" \
          -H 'Content-Type: application/json' \
          -H "X-PrintMaster-Signature: sha256=$signature" \
          --data "$payload"
      continue-on-error: true
