name: Installer permissions

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  native:
    name: Installer permissions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum
      - name: Native permission and substitution checks
        env:
          TMPDIR: ${{ runner.os == 'macOS' && '/private/tmp' || runner.temp }}
        working-directory: .
        run: node scripts/run-tests.js --suite native
      - name: Root permission and native package fixtures
        if: runner.os != 'Windows'
        run: bash tests.sh --suite privileged --privileged
