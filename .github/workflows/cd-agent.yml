name: CD Agent
run-name: "CD Agent: ${{ github.ref_name }}"

on:
  push:
    branches: [main]
    tags:
      - 'agent-v[0-9]+.[0-9]+.[0-9]+'
      - 'agent-v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR/Docker require lowercase image paths, but the
  # GitHub org name (Printmaster-Org) contains uppercase letters.
  IMAGE_NAME: printmaster-org/printmaster

permissions:
  contents: read

jobs:
  # Wait for CI to pass on this commit
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: read
    steps:
    - name: Wait for CI checks to pass
      uses: matiasalbarello/wait-on-check-action-ts@8087812521cdb59ebc7751984b31b17209b30eeb # v1.2.0
      timeout-minutes: 15
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        check-name: CI Passed
        ref: ${{ github.sha }}
        allowed-conclusions: success
        wait-interval: 15
        fail-on-no-checks: 'true'
        # CI's aggregate job may not register immediately; allow the full wait budget.
        checks-discovery-timeout: 900

  build-agent:
    name: Build Agent Binaries
    needs: [wait-for-ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
          - os: ubuntu-26.04
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.0'
        cache-dependency-path: |
          common/go.sum
          agent/go.sum
    
    - name: Get version
      id: version
      shell: bash
      run: |
        bash scripts/release-version.sh agent "$GITHUB_REF" >> "$GITHUB_OUTPUT"
    
    - name: Build Agent
      working-directory: ./agent
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X 'main.Version=${{ steps.version.outputs.agent_version }}' -X 'main.BuildTime=${{ steps.version.outputs.build_time }}' -X 'main.GitCommit=${{ steps.version.outputs.git_commit }}' -X 'main.BuildType=${{ steps.version.outputs.build_type }}'" -o printmaster-agent-v${{ steps.version.outputs.agent_version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

    - name: Build Debian Package (Linux)
      if: matrix.goos == 'linux'
      working-directory: ./agent
      run: |
        # Copy binary to expected location for build script
        cp "printmaster-agent-v${{ steps.version.outputs.agent_version }}-linux-${{ matrix.goarch }}" "printmaster-agent"
        chmod +x build-deb.sh
        ./build-deb.sh "${{ steps.version.outputs.agent_version }}" "${{ matrix.goarch }}"

    - name: Upload Debian Package
      if: matrix.goos == 'linux'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-deb-${{ matrix.goarch }}
        path: agent/dist/*.deb

    - name: Install WiX Toolset (Windows)
      if: matrix.os == 'windows-latest' && steps.version.outputs.build_type == 'release'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $wixUrl = 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip'
        $wixRoot = Join-Path $env:RUNNER_TEMP 'wix311'
        if (!(Test-Path $wixRoot)) {
          New-Item -ItemType Directory -Path $wixRoot | Out-Null
        }
        $zipPath = Join-Path $wixRoot 'wix.zip'
        Invoke-WebRequest -Uri $wixUrl -OutFile $zipPath -UseBasicParsing
        Expand-Archive -Path $zipPath -DestinationPath $wixRoot -Force
        Remove-Item $zipPath -Force
        $binPath = Join-Path $wixRoot 'wix311-binaries'
        if (!(Test-Path (Join-Path $binPath 'candle.exe'))) {
          $binPath = $wixRoot
        }
        "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build Agent MSI
      if: matrix.os == 'windows-latest' && steps.version.outputs.build_type == 'release'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $agentVersion = '${{ steps.version.outputs.agent_version }}'
        if (-not $agentVersion) { throw 'agent version not detected' }
        $agentExe = Join-Path (Get-Location) "agent\printmaster-agent-v${agentVersion}-windows-amd64.exe"
        if (!(Test-Path $agentExe)) {
          throw "Agent binary not found at $agentExe"
        }
        $distDir = Join-Path (Get-Location) 'agent\dist'
        if (!(Test-Path $distDir)) {
          New-Item -ItemType Directory -Path $distDir | Out-Null
        }
        # WiX requires version in x.x.x.x format - strip any dev suffix
        $baseVersion = (Get-Content 'agent/VERSION').Trim()
        $wixVersion = "$baseVersion.0"
        $wixobj = Join-Path $distDir 'printmaster-agent.wixobj'
        $wxs = 'build\windows\msi\printmaster-agent.wxs'
        $candleArgs = @(
          '-nologo',
          "-dProductVersion=$wixVersion",
          "-dAgentBinaryPath=$agentExe",
          '-out', $wixobj,
          $wxs
        )
        & candle.exe @candleArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $msiName = "printmaster-agent-v${agentVersion}-windows-amd64.msi"
        $msiPath = Join-Path $distDir $msiName
        $lightArgs = @(
          '-nologo',
          '-out', $msiPath,
          $wixobj
        )
        & light.exe @lightArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    
    - name: Upload Agent Binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-binary-${{ matrix.goos }}-${{ matrix.goarch }}
        path: agent/printmaster-agent-v${{ steps.version.outputs.agent_version }}-${{ matrix.goos }}-${{ matrix.goarch }}*

    - name: Upload Agent MSI
      if: matrix.os == 'windows-latest' && steps.version.outputs.build_type == 'release'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-windows-msi
        path: agent/dist/printmaster-agent-v${{ steps.version.outputs.agent_version }}-windows-amd64.msi

  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: [wait-for-ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            suffix: arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get version
      id: version
      run: |
        bash scripts/release-version.sh agent "$GITHUB_REF" >> "$GITHUB_OUTPUT"
    
    - name: Get container metadata
      id: container_metadata
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        REVISION: ${{ github.sha }}
        CREATED: ${{ steps.version.outputs.build_time }}
      run: |
        {
          echo 'labels<<EOF'
          bash scripts/container-metadata.sh agent "$VERSION" "$BUILD_TYPE" "$REVISION" "$CREATED"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./agent/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.container_metadata.outputs.labels }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ steps.version.outputs.build_time }}
          GIT_COMMIT=${{ steps.version.outputs.git_commit }}
          BUILD_TYPE=${{ steps.version.outputs.build_type }}
        cache-from: type=gha,scope=agent-${{ matrix.suffix }}
        cache-to: type=gha,mode=max,scope=agent-${{ matrix.suffix }}
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
        provenance: false
        sbom: false
    
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
    
    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-digests-${{ matrix.suffix }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-docker:
    name: Create Docker Manifest
    needs: [build-docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: /tmp/digests
        pattern: agent-digests-*
        merge-multiple: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get version
      id: version
      run: |
        bash scripts/release-version.sh agent "$GITHUB_REF" >> "$GITHUB_OUTPUT"
    
    - name: Get container metadata
      id: container_metadata
      env:
        VERSION: ${{ steps.version.outputs.version }}
        BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        REVISION: ${{ github.sha }}
        CREATED: ${{ steps.version.outputs.build_time }}
      run: |
        {
          echo 'labels<<EOF'
          bash scripts/container-metadata.sh agent "$VERSION" "$BUILD_TYPE" "$REVISION" "$CREATED"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release }}
          type=raw,value=latest,enable=${{ steps.version.outputs.is_release }}
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/agent-v') }}
          type=raw,value=beta,enable=${{ steps.version.outputs.is_beta }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=dev-${{ steps.version.outputs.git_commit }},enable=${{ github.ref == 'refs/heads/main' }}
        labels: ${{ steps.container_metadata.outputs.labels }}
    
    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        labels=$(jq -er '.labels | to_entries[] | "\(.key)=\(.value)"' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        annotations=()
        while IFS= read -r label; do
          annotations+=(--annotation "index:$label")
        done <<< "$labels"
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          "${annotations[@]}" \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent@sha256:%s ' *)
    
    - name: Inspect image
      run: |
        if [[ "${{ github.ref }}" == refs/tags/agent-v* ]]; then
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:${{ steps.version.outputs.version }}
        else
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:main
        fi

  build-rpm:
    name: Build RPM Packages (Fedora)
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [build-agent]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: fedora:latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    
    steps:
    - name: Install dependencies
      run: |
        dnf install -y rpm-build systemd-rpm-macros git

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download Linux binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: agent-binary-linux-${{ matrix.arch }}
        path: agent/

    - name: Get version
      id: version
      run: |
        bash scripts/release-version.sh agent "$GITHUB_REF" >> "$GITHUB_OUTPUT"

    - name: Build RPM Package
      working-directory: ./agent
      run: |
        # Find and prepare the binary
        BINARY=$(ls printmaster-agent-v*-linux-${{ matrix.arch }} 2>/dev/null | head -n 1)
        if [ -z "$BINARY" ]; then
          echo "Error: No binary found matching printmaster-agent-v*-linux-${{ matrix.arch }}"
          ls -la
          exit 1
        fi
        cp "$BINARY" printmaster-agent
        chmod +x printmaster-agent build-rpm.sh
        ./build-rpm.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"

    - name: Upload RPM Package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: agent-rpm-${{ matrix.arch }}
        path: agent/dist/*.rpm

  release-agent:
    name: Create Agent Release
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: [build-agent, merge-docker, build-rpm]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: agent-*
        merge-multiple: false
    
    - name: Get version info
      id: version
      run: |
        bash scripts/release-version.sh agent "$GITHUB_REF" >> "$GITHUB_OUTPUT"

    - name: Resolve companion Server release
      id: companion
      run: bash scripts/release-companion.sh server "${GITHUB_REF#refs/tags/agent-v}" >> "$GITHUB_OUTPUT"
    
    - name: Prepare release binaries
      run: |
        cd artifacts
        for dir in */; do
          name="${dir%/}"
          binary=$(find "$dir" -maxdepth 1 -type f -name "printmaster-*" | head -n 1)
          if [ -n "$binary" ]; then
            cp "$binary" "./$(basename "$binary")"
            echo "Prepared: $(basename "$binary")"
          fi
        done
        echo "=== Release Binaries ==="
        ls -lh printmaster-* 2>/dev/null || true
    
    - name: Generate changelog
      id: changelog
      run: |
        TAG_NAME="agent-v${{ steps.version.outputs.version }}"
        VERSION="${{ steps.version.outputs.version }}"
        VERSION="${VERSION%%-*}"
        
        # Parse version components
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        
        # Determine release type and find appropriate comparison tag
        if [ "$PATCH" = "0" ] && [ "$MINOR" = "0" ]; then
          # Major release (x.0.0) - compare against last major
          RELEASE_TYPE="major"
          PREV_MAJOR=$((MAJOR - 1))
          LAST_TAG=$(git tag -l "agent-v${PREV_MAJOR}.*" --sort=-version:refname | grep -E '^agent-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
        elif [ "$PATCH" = "0" ]; then
          # Minor release (x.y.0) - compare against last minor's first tag
          RELEASE_TYPE="minor"
          PREV_MINOR=$((MINOR - 1))
          LAST_TAG=$(git tag -l "agent-v${MAJOR}.${PREV_MINOR}.*" --sort=-version:refname | grep -E '^agent-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
        else
          # Patch release - compare against previous patch
          RELEASE_TYPE="patch"
          LAST_TAG=$(git tag -l "agent-v*" --sort=-version:refname | grep -E '^agent-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG_NAME}$" | head -n 1 || true)
        fi
        
        echo "Release type: $RELEASE_TYPE, comparing against: ${LAST_TAG:-none}"
        
        if [ -z "$LAST_TAG" ]; then
          CHANGELOG="Initial release"
        else
          # Get commits, filter release commits, and categorize
          RAW_LOG=$(git log ${LAST_TAG}..${TAG_NAME} --pretty=format:"%s|||%h" --no-merges 2>/dev/null || echo "")
          
          if [ -z "$RAW_LOG" ]; then
            CHANGELOG="- Bug fixes and improvements"
          else
            # Categorize commits by conventional commit type
            FEATURES=""
            FIXES=""
            DOCS=""
            REFACTORS=""
            OTHER=""
            
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              MSG=$(echo "$line" | cut -d'|' -f1)
              HASH=$(echo "$line" | rev | cut -d'|' -f1 | rev)
              
              # Skip release commits
              echo "$MSG" | grep -q "^chore: Release" && continue
              echo "$MSG" | grep -q "^chore(release)" && continue
              
              # Categorize by type
              if echo "$MSG" | grep -qE "^feat(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^feat[^:]*: //')
                FEATURES="${FEATURES}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^fix(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^fix[^:]*: //')
                FIXES="${FIXES}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^docs(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^docs[^:]*: //')
                DOCS="${DOCS}- ${DESC} (${HASH})\n"
              elif echo "$MSG" | grep -qE "^refactor(\([^)]+\))?:"; then
                DESC=$(echo "$MSG" | sed 's/^refactor[^:]*: //')
                REFACTORS="${REFACTORS}- ${DESC} (${HASH})\n"
              elif ! echo "$MSG" | grep -qE "^(chore|test|ci|build)(\([^)]+\))?:"; then
                # Include non-chore/test/ci/build commits in OTHER
                OTHER="${OTHER}- ${MSG} (${HASH})\n"
              fi
            done <<< "$RAW_LOG"
            
            # Build changelog with sections
            CHANGELOG=""
            [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### ✨ Features\n${FEATURES}\n"
            [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n"
            [ -n "$REFACTORS" ] && CHANGELOG="${CHANGELOG}### ♻️ Refactoring\n${REFACTORS}\n"
            [ -n "$DOCS" ] && CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n"
            [ -n "$OTHER" ] && CHANGELOG="${CHANGELOG}### 📝 Other Changes\n${OTHER}\n"
            
            # Fallback if nothing was categorized
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Bug fixes and improvements"
            fi
          fi
        fi
        
        # For major releases, add a note about checking full changelog
        if [ "$RELEASE_TYPE" = "major" ]; then
          CHANGELOG="**🎉 Major Release**\n\nThis is a major version update. Please review the [full changelog](https://github.com/printmaster-org/printmaster/compare/${LAST_TAG}...${TAG_NAME}) for breaking changes.\n\n${CHANGELOG}"
        fi
        
        {
          echo 'CHANGELOG<<EOF'
          echo -e "$CHANGELOG"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: PrintMaster Agent v${{ steps.version.outputs.version }}
        body: |
          ## PrintMaster Agent v${{ steps.version.outputs.version }}
          
          ### 📝 Changes
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ---
          
          ### 📦 Quick Install

          ${{ steps.version.outputs.is_beta == 'true' && '**Beta release:** Install the versioned binaries, DEB/RPM assets, or Docker image below. The package-repository commands install Stable, not this Beta. MSI installers are Stable-only.' || '' }}
          
          **Debian/Ubuntu:**
          ```bash
          curl -fsSL https://packages.printmaster.work/install.sh | sudo bash
          ```
          
          **Fedora/RHEL (DNF repo):**
          ```bash
          sudo dnf config-manager addrepo --from-repofile=https://packages.printmaster.work/printmaster.repo && sudo dnf install -y printmaster-agent
          ```
          
          ${{ steps.version.outputs.is_beta == 'true' && '**Windows:** Download the `.exe` binary from Assets below. MSI installers are Stable-only.' || '**Windows:** Download the MSI installer from Assets below.' }}
          
          **Docker:**
          ```bash
          docker run -d -p 8080:8080 -v agent-data:/var/lib/printmaster/agent ghcr.io/printmaster-org/printmaster-agent:${{ steps.version.outputs.version }}
          ```
          
          Web UI at http://localhost:8080 after install.
          
          **Supported Platforms:** Debian/Ubuntu • Fedora/RHEL • Windows • Docker • macOS
          
          ---
          
          ### 🖥️ Server Download
          
          ${{ steps.companion.outputs.server_section }}
          
          ---
          
          ### ⏱️ Build Information
          - **Workflow run:** ${{ github.run_id }}
          - **Commit:** ${{ github.sha }}
          
          ### 🔗 Links
          - [Documentation](https://docs.printmaster.work/)
          - [Docker Images](https://github.com/printmaster-org/printmaster/pkgs/container/printmaster-agent)
          - [Issue Tracker](https://github.com/printmaster-org/printmaster/issues)
        files: artifacts/printmaster-*
        fail_on_unmatched_files: false
        draft: false
        prerelease: ${{ steps.version.outputs.is_beta == 'true' }}
        make_latest: ${{ steps.version.outputs.is_beta != 'true' }}

    - name: Notify website about published Agent release
      env:
        WEBHOOK_SECRET: ${{ secrets.PRINTMASTER_WEBSITE_RELEASE_SECRET }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        if [[ -z "$WEBHOOK_SECRET" ]]; then
          echo "Website release webhook secret is not configured; skipping notification."
          exit 0
        fi
        payload=$(jq -cn --arg tag "$RELEASE_TAG" '{tag_name: $tag}')
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
        curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          -X POST "https://printmaster.work/api/releases/refresh" \
          -H 'Content-Type: application/json' \
          -H "X-PrintMaster-Signature: sha256=$signature" \
          --data "$payload"
      continue-on-error: true

  release-agent-dev:
    name: Create Agent Dev Release
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    # RPM packaging is tag-only. A skipped RPM dependency would implicitly
    # skip this job on every main push, even when all dev binaries succeeded.
    needs: [build-agent, merge-docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    
    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: agent-*
        merge-multiple: false
    
    - name: Get version info
      id: version
      run: |
        BASE_VERSION=$(cat agent/VERSION)
        BASE_VERSION="${BASE_VERSION%%-*}"
        GIT_COMMIT=$(git rev-parse --short HEAD)
        DEV_VERSION="${BASE_VERSION}-dev.${GIT_COMMIT}"
        echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "tag=agent-v$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
        echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
    
    - name: Prepare release binaries
      env:
        DEV_VERSION: ${{ steps.version.outputs.version }}
      run: bash scripts/prepare-agent-dev-release.sh artifacts "$DEV_VERSION"
    
    - name: Delete existing dev release (if any)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete the existing dev tag/release if it exists (we always update the dev release)
        TAG="agent-v${{ steps.version.outputs.version }}"
        if gh release view "$TAG" &>/dev/null; then
          echo "Deleting existing release $TAG..."
          gh release delete "$TAG" --yes || true
        fi
        if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
          echo "Deleting existing tag $TAG..."
          git push origin --delete "$TAG" || true
        fi
    
    - name: Create GitHub Dev Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: PrintMaster Agent v${{ steps.version.outputs.version }} (Dev)
        body: |
          ## PrintMaster Agent v${{ steps.version.outputs.version }} (Development Build)
          
          ⚠️ **This is a development build from the main branch.** It may contain unstable or experimental features.
          
          To receive dev builds automatically, set your server's `releases.include_prerelease = "true"` or run a dev build of the server.
          
          ---
          
          ### ⏱️ Build Information
          - **Base Version:** ${{ steps.version.outputs.base_version }}
          - **Commit:** ${{ steps.version.outputs.git_commit }}
          - **Full SHA:** ${{ github.sha }}
          - **Workflow run:** ${{ github.run_id }}
          
          ### 🔗 Links
          - [Documentation](https://docs.printmaster.work/)
          - [Docker Images](https://github.com/printmaster-org/printmaster/pkgs/container/printmaster-agent)
          - [Issue Tracker](https://github.com/printmaster-org/printmaster/issues)
        files: artifacts/printmaster-*
        fail_on_unmatched_files: true
        draft: false
        prerelease: true

    - name: Notify website about published Agent Dev release
      env:
        WEBHOOK_SECRET: ${{ secrets.PRINTMASTER_WEBSITE_RELEASE_SECRET }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: |
        if [[ -z "$WEBHOOK_SECRET" ]]; then
          echo "Website release webhook secret is not configured; skipping notification."
          exit 0
        fi
        payload=$(jq -cn --arg tag "$RELEASE_TAG" '{tag_name: $tag}')
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
        curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused \
          -X POST "https://printmaster.work/api/releases/refresh" \
          -H 'Content-Type: application/json' \
          -H "X-PrintMaster-Signature: sha256=$signature" \
          --data "$payload"
      continue-on-error: true

  update-package-repos:
    name: Update Package Repositories (APT + DNF)
    if: startsWith(github.ref, 'refs/tags/agent-v') && !contains(github.ref, '-beta.')
    needs: [build-agent, build-rpm]
    runs-on: ubuntu-26.04
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
    
    steps:
    - name: Checkout gh-pages
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        path: apt-repo
      continue-on-error: true

    - name: Initialize gh-pages if needed
      run: |
        if [ ! -d "apt-repo/.git" ]; then
          echo "Creating gh-pages branch..."
          mkdir -p apt-repo
          cd apt-repo
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git checkout -b gh-pages
          echo "# PrintMaster Package Repository" > README.md
        fi

    - name: Download deb artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: agent-deb-*
        path: downloads-deb
        merge-multiple: true

    - name: Download rpm artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: agent-rpm-*
        path: downloads-rpm
        merge-multiple: true

    - name: Get version
      id: version
      run: |
        echo "version=$(cat apt-repo/../agent/VERSION 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Checkout main for version
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: main-repo
        sparse-checkout: |
          agent/VERSION
          scripts/install-agent.sh
          packaging/site

    - name: Get version from main
      id: main_version
      run: |
        echo "version=$(cat main-repo/agent/VERSION)" >> $GITHUB_OUTPUT

    # Keep in sync with package-site.yml, which republishes these files without a release.
    - name: Publish static package site files
      run: |
        install -m 0755 main-repo/scripts/install-agent.sh apt-repo/install.sh
        install -m 0644 main-repo/packaging/site/index.html apt-repo/index.html
        install -m 0644 main-repo/packaging/site/printmaster.repo apt-repo/printmaster.repo
        install -m 0644 main-repo/packaging/site/CNAME apt-repo/CNAME

    - name: Install APT repo tools
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev apt-utils gnupg createrepo-c rpm expect

    - name: Import GPG key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      run: |
        if [ -n "$GPG_PRIVATE_KEY" ]; then
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG key imported"
          
          # Export public key for users to download
          gpg --armor --export > apt-repo/gpg.key
          echo "Public key exported to gpg.key"
        else
          echo "No GPG key configured, skipping import"
        fi

    - name: Setup APT repository structure
      run: |
        cd apt-repo
        
        # Create directory structure
        mkdir -p pool/main
        mkdir -p dists/stable/main/binary-amd64
        mkdir -p dists/stable/main/binary-arm64
        
        # Copy new .deb files to pool
        if ls ../downloads-deb/*.deb 1>/dev/null 2>&1; then
          cp ../downloads-deb/*.deb pool/main/
          echo "Copied packages to pool:"
          ls -la pool/main/
        else
          echo "No .deb packages found in downloads-deb"
          ls -la ../downloads-deb/ || true
        fi

    - name: Setup DNF repository structure
      run: |
        cd apt-repo
        
        # Create RPM directory structure
        mkdir -p rpm/packages
        
        # Copy new .rpm files to rpm directory
        if ls ../downloads-rpm/*.rpm 1>/dev/null 2>&1; then
          cp ../downloads-rpm/*.rpm rpm/packages/
          echo "Copied RPM packages:"
          ls -la rpm/packages/
        else
          echo "No .rpm packages found in downloads-rpm"
          ls -la ../downloads-rpm/ || true
        fi

    - name: Generate APT repository metadata
      run: |
        cd apt-repo
        
        # Check if we have any packages
        if ! ls pool/main/*.deb 1>/dev/null 2>&1; then
          echo "No packages in pool, skipping metadata generation"
          exit 0
        fi
        
        # Generate Packages files for each architecture
        for arch in amd64 arm64; do
          echo "Generating Packages for $arch..."
          mkdir -p dists/stable/main/binary-$arch
          
          # Generate Packages file - run from repo root so paths are correct (pool/main/...)
          dpkg-scanpackages --arch $arch pool/main /dev/null > dists/stable/main/binary-$arch/Packages 2>/dev/null || true
          
          # Compress
          gzip -9c dists/stable/main/binary-$arch/Packages > dists/stable/main/binary-$arch/Packages.gz
          
          echo "Packages for $arch:"
          cat dists/stable/main/binary-$arch/Packages || true
        done

    - name: Generate Release file
      run: |
        cd apt-repo
        
        # Check if we have packages
        if ! ls pool/main/*.deb 1>/dev/null 2>&1; then
          echo "No packages, skipping Release generation"
          exit 0
        fi
        
        cd dists/stable
        
        # Generate Release file
        cat > Release << EOF
        Origin: PrintMaster
        Label: PrintMaster
        Suite: stable
        Codename: stable
        Architectures: amd64 arm64
        Components: main
        Description: PrintMaster Agent APT Repository
        Date: $(date -Ru)
        EOF
        
        # Add checksums
        {
          echo "MD5Sum:"
          find main -type f \( -name "Packages" -o -name "Packages.gz" \) -exec sh -c 'echo " $(md5sum "$1" | cut -d" " -f1) $(stat -c%s "$1") $1"' _ {} \;
          echo "SHA256:"
          find main -type f \( -name "Packages" -o -name "Packages.gz" \) -exec sh -c 'echo " $(sha256sum "$1" | cut -d" " -f1) $(stat -c%s "$1") $1"' _ {} \;
        } >> Release
        
        echo "Release file:"
        cat Release

    - name: Sign Release file
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      run: |
        # Normalize passphrase (treat whitespace-only as empty)
        GPG_PASSPHRASE="$(echo "$GPG_PASSPHRASE" | xargs)"
        
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "No GPG key configured, skipping signing"
          exit 0
        fi
        
        cd apt-repo/dists/stable
        
        # Sign Release file
        gpg --batch --yes --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" \
          --armor --detach-sign --output Release.gpg Release
        
        gpg --batch --yes --pinentry-mode loopback \
          --passphrase "$GPG_PASSPHRASE" \
          --armor --clearsign --output InRelease Release
        
        echo "Release signed"

    - name: Sign RPM packages
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      run: |
        # Normalize passphrase (treat whitespace-only as empty)
        GPG_PASSPHRASE="$(echo "$GPG_PASSPHRASE" | xargs)"
        
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "No GPG key configured, skipping RPM signing"
          exit 0
        fi
        
        cd apt-repo
        
        # Check if we have RPM packages
        if ! ls rpm/packages/*.rpm 1>/dev/null 2>&1; then
          echo "No RPM packages to sign"
          exit 0
        fi
        
        # Get the GPG key ID
        GPG_KEY_ID=$(gpg --list-keys --keyid-format SHORT | grep -A1 "^pub" | tail -1 | awk '{print $1}')
        echo "Using GPG key: $GPG_KEY_ID"
        
        # Configure rpmmacros for signing
        mkdir -p ~/.gnupg
        echo "%_gpg_name $GPG_KEY_ID" >> ~/.rpmmacros
        echo "%__gpg_sign_cmd %{__gpg} gpg --batch --verbose --no-armor --pinentry-mode loopback --passphrase \"$GPG_PASSPHRASE\" -u \"%{_gpg_name}\" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" >> ~/.rpmmacros
        
        # Sign each RPM package
        for rpm in rpm/packages/*.rpm; do
          echo "Signing $rpm..."
          rpm --addsign "$rpm" <<< "$GPG_PASSPHRASE" || {
            # Alternative method using rpmsign directly
            echo "Trying alternative signing method..."
            rpmsign --addsign --key-id="$GPG_KEY_ID" "$rpm" <<< "$GPG_PASSPHRASE" || {
              echo "Warning: Failed to sign $rpm, trying expect-based approach..."
              # Final fallback - use expect if available
              if command -v expect &> /dev/null; then
                expect -c "
                  spawn rpm --addsign $rpm
                  expect \"Enter pass phrase:\"
                  send \"$GPG_PASSPHRASE\r\"
                  expect eof
                "
              else
                echo "ERROR: Could not sign $rpm"
              fi
            }
          }
        done
        
        echo "Verifying RPM signatures:"
        for rpm in rpm/packages/*.rpm; do
          rpm -K "$rpm" || true
        done

    - name: Generate DNF repository metadata
      run: |
        cd apt-repo
        
        # Check if we have any RPM packages
        if ! ls rpm/packages/*.rpm 1>/dev/null 2>&1; then
          echo "No RPM packages in rpm/packages, skipping metadata generation"
          exit 0
        fi
        
        echo "Generating DNF/YUM repository metadata..."
        createrepo_c rpm/
        
        echo "Repository metadata generated:"
        ls -la rpm/repodata/

    - name: Sign RPM repository metadata
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      run: |
        # Normalize passphrase (treat whitespace-only as empty)
        GPG_PASSPHRASE="$(echo "$GPG_PASSPHRASE" | xargs)"
        
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "No GPG key configured, skipping RPM signing"
          exit 0
        fi
        
        cd apt-repo
        
        # Check if we have RPM packages
        if ! ls rpm/packages/*.rpm 1>/dev/null 2>&1; then
          echo "No RPM packages to sign"
          exit 0
        fi
        
        # Sign repomd.xml
        if [ -f rpm/repodata/repomd.xml ]; then
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output rpm/repodata/repomd.xml.asc rpm/repodata/repomd.xml
          echo "RPM repository metadata signed"
        fi

    - name: Commit and push changes
      run: |
        cd apt-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update package repositories (APT + DNF) - v${{ steps.main_version.outputs.version }}"
          git push origin gh-pages
        fi
        # GitHub Pages automatically serves the gh-pages branch - no artifact upload needed
