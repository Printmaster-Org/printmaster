name: CI
run-name: "CI: ${{ github.ref_name }} (${{ github.event.head_commit.message || github.event.pull_request.title || 'manual' }})"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  modules:
    name: Discover Go modules
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: node -e 'const {modulesAt}=require("./scripts/run-tests"); console.log("modules="+JSON.stringify(modulesAt(process.cwd())))' >> "$GITHUB_OUTPUT"

  go:
    name: Go (${{ matrix.module }})
    needs: modules
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Install lint prerequisite
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Check reachable Go vulnerabilities
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd "$TEST_MODULE"
          govulncheck ./...
      - name: Test all discovered Go modules
        env:
          TEST_MODULE: ${{ matrix.module }}
        run: bash tests.sh --suite lint,go --module "$TEST_MODULE" --coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: '${{ matrix.module }}/coverage.out'
          flags: ${{ matrix.module }}
          fail_ci_if_error: false

  installer-permissions:
    uses: ./.github/workflows/installer-permissions.yml

  legacy-updaters:
    name: Legacy updater bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Exercise pinned historical clients against current Server
        env:
          PRINTMASTER_TEST_LEGACY_UPDATERS: '1'
        run: node scripts/run-tests.js --suite go --module server --package ./
      - name: Require modern TUF authorization without legacy fallback
        run: node scripts/run-tests.js --suite go --module agent --package ./autoupdate

  javascript:
    name: Jest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Jest
        run: bash tests.sh --suite js

  playwright:
    name: Playwright (${{ matrix.shard }}/6)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Use upstream Ubuntu package mirror
        timeout-minutes: 1
        run: |
          set -eu
          grep -q 'http://azure.archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - name: Install Playwright system dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium firefox webkit
      - name: Ensure Playwright browsers
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: npx playwright install chromium firefox webkit
      - name: Playwright shard
        timeout-minutes: 10
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: bash tests.sh --suite playwright --shard "$TEST_SHARD/6"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: PostgreSQL tests
        run: bash tests.sh --suite integration --coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: server/coverage-integration.out
          flags: server-integration
          fail_ci_if_error: false

  e2e:
    name: E2E (Docker)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install SQLite seed prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sqlite3
      - name: Isolated Docker E2E
        run: bash tests.sh --suite docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: e2e-docker-results
          path: test-results/pm-tests-*/
          if-no-files-found: ignore

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-26.04
    needs: [modules, go, installer-permissions, legacy-updaters, javascript, playwright, integration, e2e]
    if: always()
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); if (Object.values(results).some(job => job.result !== "success")) { console.error(results); process.exit(1); } console.log("All CI checks passed");'
