name: CI
run-name: "CI: ${{ github.ref_name }} (${{ github.event.head_commit.message || github.event.pull_request.title || 'manual' }})"

on:
  push:
    branches: [main]
    tags:
      - 'agent-v[0-9]+.[0-9]+.[0-9]+'
      - 'server-v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  # ============================================================================
  # LINT & TEST - Common runs first, agent/server run in parallel after
  # ============================================================================
  common:
    name: Common
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum
            server/go.sum

      - name: Lint
        working-directory: ./common
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go vet ./...
          staticcheck ./...

      - name: Test
        working-directory: ./common
        run: go test -v -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./common/coverage.out
          flags: common
          fail_ci_if_error: false

  agent:
    name: Agent
    runs-on: ubuntu-26.04
    needs: [common]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum

      - name: Lint
        working-directory: ./agent
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go vet ./...
          staticcheck ./...

      - name: Test
        working-directory: ./agent
        run: go test -v -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./agent/coverage.out
          flags: agent
          fail_ci_if_error: false

  server:
    name: Server
    runs-on: ubuntu-26.04
    needs: [common]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            server/go.sum

      - name: Lint
        working-directory: ./server
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go vet ./...
          staticcheck ./...

      - name: Test
        working-directory: ./server
        run: go test -v -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./server/coverage.out
          flags: server
          fail_ci_if_error: false

      - name: Integration Tests (Postgres)
        working-directory: ./server
        run: go test -v -tags=integration -coverprofile=coverage-integration.out ./storage/...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./server/coverage-integration.out
          flags: server-integration
          fail_ci_if_error: false

  # ============================================================================
  # JAVASCRIPT - Jest unit tests + Playwright UI tests
  # ============================================================================
  javascript:
    name: JavaScript
    runs-on: ubuntu-26.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Jest unit tests
        run: npm run test:js

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate Playwright browsers (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium firefox webkit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum
            server/go.sum

      - name: Build binaries for Playwright
        run: |
          (cd agent && go build -o printmaster-agent .)
          (cd server && go build -o printmaster-server .)

      - name: Playwright tests (cross-browser)
        env:
          PW_ALL_BROWSERS: '1'
          # CI runners have limited CPU; too many parallel browser workers
          # causes actionability/networkidle timeouts under contention.
          PW_WORKERS: '2'
        run: npm run test:playwright:all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore

  # ============================================================================
  # E2E - Runs after both agent and server pass (mock-based tests)
  # ============================================================================
  e2e:
    name: E2E (Mock)
    runs-on: ubuntu-26.04
    needs: [agent, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum
            server/go.sum
            tests/go.sum

      - name: Run E2E tests (mock-based)
        working-directory: ./tests
        run: go test -v -count=1 ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-test-results
          path: tests/*.log
          if-no-files-found: ignore

  # ============================================================================
  # E2E Docker - Full integration tests with real containers
  # ============================================================================
  e2e-docker:
    name: E2E (Docker)
    runs-on: ubuntu-26.04
    needs: [agent, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Create data directories
        run: |
          mkdir -p tests/testdata/server
          mkdir -p tests/testdata/agent

      - name: Start E2E environment
        working-directory: ./tests
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build server agent
          echo "Waiting for services to be healthy..."
          sleep 10
          docker compose -f docker-compose.e2e.yml ps

      - name: Wait for services (schema init)
        run: ./tests/wait_for_e2e_services.sh

      # Seed data with the sqlite3 CLI while the servers are stopped. Seeding
      # while the containers are running caused intermittent "database disk
      # image is malformed" errors: the Go server holds server.db/agent.db
      # open in WAL mode via the pure-Go modernc.org/sqlite driver, and
      # writing into the same file concurrently from the C sqlite3 CLI (a
      # different SQLite implementation) is an unsafe multi-writer race.
      - name: Stop containers before seeding
        working-directory: ./tests
        run: docker compose -f docker-compose.e2e.yml down

      - name: Seed test data (containers stopped)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sqlite3

          # Files are owned by root (container's default user); fold any
          # pending WAL frames into the main file, then seed.
          echo "Seeding server test data..."
          sudo sqlite3 tests/testdata/server/server.db "PRAGMA wal_checkpoint(FULL);"
          sudo sqlite3 tests/testdata/server/server.db < tests/testdata/seed/server_data.sql

          echo "Seeding agent test data..."
          sudo sqlite3 tests/testdata/agent/agent.db "PRAGMA wal_checkpoint(FULL);"
          sudo sqlite3 tests/testdata/agent/agent.db < tests/testdata/seed/agent_data.sql

          echo "Verifying seeded data..."
          sudo sqlite3 tests/testdata/server/server.db "SELECT 'Server devices: ' || COUNT(*) FROM devices;"
          sudo sqlite3 tests/testdata/agent/agent.db "SELECT 'Agent devices: ' || COUNT(*) FROM devices;"

      - name: Restart E2E environment (seeded data)
        working-directory: ./tests
        run: |
          docker compose -f docker-compose.e2e.yml up -d server agent
          echo "Waiting for services to be healthy..."
          sleep 10
          docker compose -f docker-compose.e2e.yml ps

      - name: Wait for services (post-seed)
        run: ./tests/wait_for_e2e_services.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            common/go.sum
            agent/go.sum
            server/go.sum
            tests/go.sum

      - name: Run E2E Docker tests
        working-directory: ./tests
        env:
          E2E_SERVER_URL: http://localhost:9090
          E2E_AGENT_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: e2e-test-password
        run: go test -tags=e2e -v -count=1 ./...

      - name: Collect container logs
        if: always()
        working-directory: ./tests
        run: |
          mkdir -p results
          docker compose -f docker-compose.e2e.yml logs server > results/server.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs agent > results/agent.log 2>&1 || true

      - name: Stop E2E environment
        if: always()
        working-directory: ./tests
        run: docker compose -f docker-compose.e2e.yml down -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-docker-results
          path: tests/results/
          if-no-files-found: ignore

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-26.04
    needs: [agent, server, javascript, e2e, e2e-docker]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.agent.result }}" != "success" || "${{ needs.server.result }}" != "success" || "${{ needs.javascript.result }}" != "success" || "${{ needs.e2e.result }}" != "success" || "${{ needs.e2e-docker.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
