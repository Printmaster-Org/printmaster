version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "/agent"
      - "/server"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/server"
      - "/tests"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/agent"
    schedule:
      interval: "weekly"
    groups:
      agent-go-deps:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      server-go-deps:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/common"
    schedule:
      interval: "weekly"
    groups:
      common-go-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      root-npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "weekly"
    groups:
      cloudflare-worker-npm-deps:
        patterns:
          - "*"
