# PrintMaster E2E Test Environment
#
# This Docker Compose file creates a fully isolated test environment with:
# - Server container with test configuration
# - Agent container pre-configured to connect to server
# - Pre-seeded SQLite databases for predictable test data
#
# Usage:
#   Local:  docker compose -f tests/docker-compose.e2e.yml up --build -d
#   CI:     See .github/workflows/ci.yml
#
# Test data is seeded via the testdata/ directory mounted into containers.

services:
  # ==========================================================================
  # PrintMaster Server (E2E Test Instance)
  # ==========================================================================
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VERSION: e2e-test
        BUILD_TIME: ${BUILD_TIME:-2026-01-01T00:00:00Z}
        GIT_COMMIT: ${GIT_COMMIT:-e2e-test}
    hostname: server
    environment:
      # Run in HTTP-only mode (behind_proxy mode without actual proxy)
      # This makes the server listen on HTTP port only (no TLS)
      BEHIND_PROXY: "true"
      # Use SQLite for E2E tests (simpler, no external DB needed)
      SERVER_DB_TYPE: "sqlite"
      # Database path (direct path to the pre-seeded SQLite database)
      SERVER_DB_PATH: "/data/server.db"
      # Admin credentials for tests
      ADMIN_PASSWORD: "e2e-test-password"
      # Disable auto-update checks in tests
      AUTOUPDATE_ENABLED: "false"
      # Container detection (used by config.GetDataDirectory)
      DOCKER: "true"
    ports:
      - "127.0.0.1:${PM_E2E_SERVER_PORT:-9090}:9090"
    volumes:
      # Mount test data directory (contains seed DB)
      - ${PM_E2E_DATA_ROOT:-./testdata}/server:/data
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD", "/printmaster-server", "--health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ==========================================================================
  # PrintMaster Agent (E2E Test Instance)
  # ==========================================================================
  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
      args:
        VERSION: e2e-test
        BUILD_TIME: ${BUILD_TIME:-2026-01-01T00:00:00Z}
        GIT_COMMIT: ${GIT_COMMIT:-e2e-test}
    hostname: agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Database path (direct path to the pre-seeded SQLite database)
      AGENT_DB_PATH: "/data/agent.db"
      # Connect to server (correct env var names)
      SERVER_URL: "http://server:9090"
      SERVER_ENABLED: "true"
      # Agent identity
      AGENT_NAME: "e2e-test-agent"
      # HTTP port for agent web UI
      WEB_HTTP_PORT: "8080"
      # Disable auth for E2E tests (simplifies testing)
      WEB_AUTH_MODE: "disabled"
      # Disable auto-update in tests
      AUTOUPDATE_ENABLED: "false"
      # Container detection (used by config.GetDataDirectory)
      DOCKER: "true"
    ports:
      - "127.0.0.1:${PM_E2E_AGENT_PORT:-8080}:8080"
    volumes:
      # Mount test data directory (contains seed DB)
      - ${PM_E2E_DATA_ROOT:-./testdata}/agent:/data
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD", "/printmaster-agent", "--health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ==========================================================================
  # Test Runner - Runs E2E tests against the environment
  # ==========================================================================
  test-runner:
    image: golang:1.27.3-alpine
    container_name: pm-e2e-runner
    depends_on:
      server:
        condition: service_healthy
      agent:
        condition: service_healthy
    working_dir: /app/tests
    environment:
      # Test configuration
      E2E_SERVER_URL: "http://server:9090"
      E2E_AGENT_URL: "http://agent:8080"
      E2E_ADMIN_PASSWORD: "e2e-test-password"
      # Run all tests, not short mode
      GO_TEST_FLAGS: "-v -count=1"
    volumes:
      # Mount entire project (read-only except tests output)
      - ..:/app:ro
      - ./results:/app/tests/results
    networks:
      - e2e-net
    command: >
      sh -c "
        cd /app/tests &&
        go test ${GO_TEST_FLAGS:-'-v'} -tags=e2e ./... > results/e2e-output.log 2>&1;
        exit_code=$$?;
        cat results/e2e-output.log;
        echo 'Test exit code:' $$exit_code > results/exit-code.txt;
        exit $$exit_code
      "

networks:
  e2e-net:
    driver: bridge
